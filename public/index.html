<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostScan ✨ Universal Studio</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

    :root {
      --pookie-pink: #f472b6;
      --pookie-deep: #db2777;
      --pookie-border: #fbcfe8;
      --text-main: #4c0519;
      --text-muted: #9d174d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #fff5f8; color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--pookie-border);
      padding: 12px 28px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 40;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      width: 42px; height: 42px; background: linear-gradient(135deg, #f472b6, #ec4899);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3);
    }
    .brand h1 { font-size: 18px; font-weight: 800; color: var(--text-main); }
    .badge-live {
      font-size: 11px; color: #9d174d; background: #fce7f3; border: 1px solid #fbcfe8;
      padding: 4px 10px; border-radius: 20px; font-weight: 700;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px;
      font-size: 13px; font-weight: 700; border-radius: 25px; border: none;
      cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-secondary { background: #ffffff; border: 1.5px solid var(--pookie-border); color: var(--text-main); }
    .btn-primary { background: linear-gradient(135deg, #f472b6, #ec4899); color: #fff; }
    .btn-send { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; }
    .btn-danger { background: #ffe4e6; color: #be123c; border: 1.5px solid #fecdd3; }

    main { flex: 1; padding: 24px 28px; max-width: 1440px; margin: 0 auto; width: 100%; }
    .subbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .count-pill { font-size: 13px; font-weight: 700; color: #be185d; background: #fdf2f8; padding: 6px 14px; border-radius: 20px; border: 1px solid #fbcfe8; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .empty-state {
      grid-column: 1 / -1; background: #ffffff; border: 2px dashed #f9a8d4;
      border-radius: 24px; padding: 80px 20px; text-align: center; color: var(--text-muted);
    }

    .doc-card {
      background: #ffffff; border-radius: 18px; border: 2px solid var(--pookie-border);
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 6px 16px rgba(244, 114, 182, 0.12);
    }
    .preview-box {
      height: 220px; background: #fff0f5; display: flex;
      justify-content: center; align-items: center; position: relative; overflow: hidden;
    }
    .preview-box img { max-width: 90%; max-height: 90%; object-fit: contain; }
    .preview-box video { width: 100%; height: 100%; object-fit: cover; }
    .file-icon-box { text-align: center; }
    .file-icon-box .emoji { font-size: 54px; margin-bottom: 6px; }
    .file-icon-box .fname { font-size: 12px; font-weight: 700; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .card-footer {
      padding: 12px 14px; background: #ffffff; border-top: 1.5px solid var(--pookie-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .type-pill { font-size: 11px; font-weight: 800; color: #be185d; background: #fce7f3; padding: 4px 8px; border-radius: 10px; }
    .action-icons { display: flex; gap: 5px; }
    .icon-btn {
      background: #fff5f8; border: 1px solid #fbcfe8; padding: 6px 8px;
      font-size: 13px; border-radius: 10px; cursor: pointer;
    }
    .icon-btn:hover { background: #fce7f3; transform: scale(1.1); }
    .icon-btn.delete:hover { background: #ffe4e6; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(76, 5, 25, 0.6);
      backdrop-filter: blur(6px); display: none; justify-content: center;
      align-items: center; z-index: 100; padding: 20px;
    }
    .modal-box {
      background: #ffffff; width: 100%; max-width: 900px; max-height: 90vh;
      border-radius: 24px; border: 2px solid var(--pookie-border);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .modal-header {
      padding: 14px 20px; border-bottom: 1.5px solid var(--pookie-border);
      display: flex; justify-content: space-between; align-items: center; background: #fff7fa;
    }
    .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }
    .modal-body { background: #1c0512; flex: 1; height: 65vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .modal-body img { max-width: 100%; max-height: 100%; }
    .modal-footer { padding: 12px 20px; border-top: 1.5px solid var(--pookie-border); display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">🎀</div>
      <div>
        <h1>GhostScan Universal ✨</h1>
      </div>
      <div class="badge-live">Two-Way Synced</div>
    </div>
    <div class="header-actions">
      <!-- Send File to Phone Button -->
      <button class="btn btn-send" onclick="document.getElementById('pcFileInput').click()">
        📤 Send to Phone
      </button>
      <input type="file" id="pcFileInput" multiple style="display:none;" onchange="sendFilesToPhone(this)" />

      <button class="btn btn-danger" onclick="clearAll()">🧹 Clear All</button>
      <button class="btn btn-secondary" onclick="exportZipJPEGs()">📦 Export Images (ZIP)</button>
      <button class="btn btn-primary" onclick="exportPDF()">🌸 Export Images (PDF)</button>
    </div>
  </header>

  <main>
    <div class="subbar">
      <span class="count-pill" id="status-counter">✨ Waiting for transfers...</span>
    </div>
    <div id="grid"></div>
  </main>

  <!-- Full Image Preview Modal -->
  <div class="modal-overlay" id="viewModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="viewTitle">Preview 👁️</h3>
        <button class="modal-close" onclick="closeViewModal()">✕</button>
      </div>
      <div class="modal-body">
        <img id="fullViewImg" src="" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeViewModal()">Close</button>
        <button class="btn btn-primary" id="viewDownloadBtn">💾 Download</button>
      </div>
    </div>
  </div>

  <!-- Crop Modal -->
  <div class="modal-overlay" id="cropModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Crop & Adjust ✂️</h3>
        <button class="modal-close" onclick="closeCropModal()">✕</button>
      </div>
      <div class="modal-body" style="position:relative;">
        <img id="cropTargetImg" src="" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeCropModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveCrop()">Save Crop</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const { jsPDF } = window.jspdf;
    let items = []; // { id, name, type, dataUri, isImage }
    let cropper = null;
    let activeCropIndex = null;

    // 1. Camera Scans from Mobile
    socket.on('new_page', (base64Img) => {
      items.push({
        id: Date.now() + Math.random(),
        name: `Scan_${Date.now()}.jpg`,
        type: 'image/jpeg',
        dataUri: 'data:image/jpeg;base64,' + base64Img,
        isImage: true
      });
      render();
    });

    // 2. Incoming Files from Phone (Video, Music, PDF, Images)
    socket.on('receive_file', (file) => {
      items.push({
        id: Date.now() + Math.random(),
        name: file.name,
        type: file.type,
        dataUri: file.data,
        isImage: file.type.startsWith('image/')
      });
      render();
    });

    // 3. Send Files from Laptop to Phone
    async function sendFilesToPhone(input) {
      const files = Array.from(input.files);
      if (!files.length) return;

      for (const file of files) {
        await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            socket.emit('send_file', {
              name: file.name,
              type: file.type || 'application/octet-stream',
              size: file.size,
              data: e.target.result
            });
            resolve();
          };
          reader.readAsDataURL(file);
        });
      }
      alert(`📤 ${files.length} file(s) sent to Phone! ✨`);
      input.value = '';
    }

    function render() {
      const grid = document.getElementById('grid');
      const counter = document.getElementById('status-counter');
      grid.innerHTML = '';

      if (items.length === 0) {
        counter.innerText = '🌸 0 Items in Workspace';
        grid.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 40px; margin-bottom: 8px;">🎀 📁 📱</div>
            <h3>Universal Drop is Live</h3>
            <p>Send Images, Videos, Music, or PDFs from Phone or Laptop.</p>
          </div>
        `;
        return;
      }

      counter.innerText = `🎀 Total Items: ${items.length}`;

      items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'doc-card';

        let previewHtml = '';
        if (item.type.startsWith('image/')) {
          previewHtml = `<div class="preview-box" onclick="openViewModal(${idx})"><img src="${item.dataUri}" /></div>`;
        } else if (item.type.startsWith('video/')) {
          previewHtml = `
            <div class="preview-box">
              <video src="${item.dataUri}" controls playsinline></video>
            </div>`;
        } else if (item.type.startsWith('audio/')) {
          previewHtml = `
            <div class="preview-box" style="flex-direction:column; padding: 10px;">
              <div class="file-icon-box"><div class="emoji">🎵</div><div class="fname">${item.name}</div></div>
              <audio src="${item.dataUri}" controls style="width: 90%; margin-top: 10px;"></audio>
            </div>`;
        } else if (item.type.includes('pdf')) {
          previewHtml = `
            <div class="preview-box">
              <div class="file-icon-box"><div class="emoji">📄</div><div class="fname">${item.name}</div></div>
            </div>`;
        } else {
          previewHtml = `
            <div class="preview-box">
              <div class="file-icon-box"><div class="emoji">📁</div><div class="fname">${item.name}</div></div>
            </div>`;
        }

        card.innerHTML = `
          ${previewHtml}
          <div class="card-footer">
            <span class="type-pill">${item.type.split('/')[1]?.toUpperCase() || 'FILE'}</span>
            <div class="action-icons">
              ${item.isImage ? `<button class="icon-btn" title="Crop" onclick="openCropModal(${idx})">✂️</button>` : ''}
              <button class="icon-btn" title="Download" onclick="downloadItem(${idx})">💾</button>
              <button class="icon-btn delete" title="Delete" onclick="deleteItem(${idx})">🗑️</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function downloadItem(index) {
      const item = items[index];
      const link = document.createElement('a');
      link.href = item.dataUri;
      link.download = item.name;
      link.click();
    }

    function deleteItem(index) {
      if (confirm(`Delete ${items[index].name}?`)) {
        items.splice(index, 1);
        render();
      }
    }

    function clearAll() {
      if (!items.length) return;
      if (confirm('Clear workspace?')) {
        items = [];
        render();
      }
    }

    // Modal preview
    function openViewModal(index) {
      const item = items[index];
      if (!item.isImage) return;
      document.getElementById('viewTitle').innerText = item.name;
      document.getElementById('fullViewImg').src = item.dataUri;
      document.getElementById('viewDownloadBtn').onclick = () => downloadItem(index);
      document.getElementById('viewModal').style.display = 'flex';
    }
    function closeViewModal() { document.getElementById('viewModal').style.display = 'none'; }

    // Crop Tool
    function openCropModal(index) {
      activeCropIndex = index;
      const targetImg = document.getElementById('cropTargetImg');
      targetImg.src = items[index].dataUri;
      document.getElementById('cropModal').style.display = 'flex';

      if (cropper) cropper.destroy();
      cropper = new Cropper(targetImg, { viewMode: 1, autoCropArea: 0.95 });
    }
    function closeCropModal() {
      document.getElementById('cropModal').style.display = 'none';
      if (cropper) { cropper.destroy(); cropper = null; }
    }
    function saveCrop() {
      if (!cropper || activeCropIndex === null) return;
      const canvas = cropper.getCroppedCanvas();
      items[activeCropIndex].dataUri = canvas.toDataURL('image/jpeg', 0.92);
      closeCropModal();
      render();
    }

    // Multi-image Exports
    async function exportZipJPEGs() {
      const images = items.filter(i => i.isImage);
      if (!images.length) return alert('No images to export!');
      const zip = new JSZip();
      images.forEach((img, idx) => {
        zip.file(`GhostScan_${idx + 1}.jpg`, img.dataUri.split(',')[1], { base64: true });
      });
      const blob = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `GhostScan_Images_${Date.now()}.zip`;
      link.click();
    }

    function exportPDF() {
      const images = items.filter(i => i.isImage);
      if (!images.length) return alert('No images to convert to PDF!');
      const pdf = new jsPDF('p', 'mm', 'a4');
      images.forEach((img, idx) => {
        if (idx > 0) pdf.addPage();
        pdf.addImage(img.dataUri, 'JPEG', 10, 10, 190, 277);
      });
      pdf.save(`GhostScan_Doc_${Date.now()}.pdf`);
    }

    render();
  </script>
</body>
</html>
