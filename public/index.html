<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostScan ✨ Pookie Edition</title>
  
  <!-- CDNs: jsPDF, JSZip, Cropper.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

    :root {
      --pookie-pink: #f472b6;
      --pookie-deep: #db2777;
      --pookie-soft: #fdf2f8;
      --pookie-card: #ffffff;
      --pookie-lavender: #f3e8ff;
      --pookie-border: #fbcfe8;
      --text-main: #4c0519;
      --text-muted: #9d174d;
      --shadow-pookie: 0 10px 25px -4px rgba(244, 114, 182, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #fff5f8; color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    /* Top Ribbon Header */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--pookie-border);
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 4px 15px rgba(251, 207, 232, 0.4);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #f472b6, #ec4899);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: 0 4px 10px rgba(236, 72, 153, 0.35);
      animation: floatBadge 3s ease-in-out infinite;
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .brand h1 { font-size: 19px; font-weight: 800; color: var(--text-main); letter-spacing: -0.3px; }
    .badge-live {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
      color: #9d174d; background: #fce7f3; border: 1px solid #fbcfe8;
      padding: 4px 12px; border-radius: 20px; font-weight: 700;
    }
    .live-sparkle { font-size: 10px; }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px;
      font-size: 13px; font-weight: 700; border-radius: 25px; border: none;
      cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn:hover { transform: translateY(-2px) scale(1.02); }
    .btn:active { transform: scale(0.96); }

    .btn-secondary {
      background: #ffffff; border: 1.5px solid var(--pookie-border);
      color: var(--text-main); box-shadow: 0 4px 10px rgba(244, 114, 182, 0.12);
    }
    .btn-secondary:hover { background: #fff0f5; }
    .btn-primary {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      color: #fff; box-shadow: 0 6px 16px rgba(236, 72, 153, 0.35);
    }
    .btn-primary:hover { box-shadow: 0 8px 20px rgba(236, 72, 153, 0.45); }
    .btn-danger {
      background: #ffe4e6; color: #be123c; border: 1.5px solid #fecdd3;
    }
    .btn-danger:hover { background: #fecdd3; }

    /* Main Grid Area */
    main { flex: 1; padding: 30px 32px; max-width: 1440px; margin: 0 auto; width: 100%; }
    .subbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .count-pill {
      font-size: 13px; font-weight: 700; color: #be185d;
      background: #fdf2f8; padding: 6px 14px; border-radius: 20px;
      border: 1px solid #fbcfe8;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }
    .empty-state {
      grid-column: 1 / -1; background: #ffffff; border: 2px dashed #f9a8d4;
      border-radius: 24px; padding: 80px 20px; text-align: center;
      color: var(--text-muted); box-shadow: var(--shadow-pookie);
    }
    .empty-state h3 { font-size: 20px; color: var(--text-main); margin-bottom: 8px; }
    .empty-icon { font-size: 42px; margin-bottom: 12px; }

    /* Cute Document Card */
    .doc-card {
      background: #ffffff; border-radius: 20px; border: 2px solid var(--pookie-border);
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 8px 18px rgba(244, 114, 182, 0.15);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .doc-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow-pookie); }

    .thumb-area {
      height: 260px; background: #fff0f5; display: flex;
      justify-content: center; align-items: center; position: relative; cursor: pointer;
    }
    .thumb-area img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px; }
    .view-overlay-btn {
      position: absolute; inset: 0; background: rgba(251, 113, 133, 0.25);
      display: flex; justify-content: center; align-items: center;
      color: #881337; font-size: 14px; font-weight: 800; opacity: 0; transition: 0.2s;
      backdrop-filter: blur(3px);
    }
    .thumb-area:hover .view-overlay-btn { opacity: 1; }

    .card-footer {
      padding: 12px 16px; background: #ffffff; border-top: 1.5px solid var(--pookie-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .page-index {
      font-size: 12px; font-weight: 800; color: #be185d;
      background: #fce7f3; padding: 4px 10px; border-radius: 12px;
    }
    .action-icons { display: flex; gap: 6px; }
    .icon-btn {
      background: #fff5f8; border: 1px solid #fbcfe8; padding: 7px 9px;
      font-size: 14px; border-radius: 10px; cursor: pointer; transition: 0.15s;
    }
    .icon-btn:hover { background: #fce7f3; transform: scale(1.1); }
    .icon-btn.delete:hover { background: #ffe4e6; border-color: #fca5a5; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(76, 5, 25, 0.55);
      backdrop-filter: blur(8px); display: none; justify-content: center;
      align-items: center; z-index: 100; padding: 20px;
    }
    .modal-box {
      background: #ffffff; width: 100%; max-width: 960px; max-height: 92vh;
      border-radius: 28px; border: 2px solid var(--pookie-border);
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 25px 50px rgba(190, 24, 93, 0.3);
    }
    .modal-header {
      padding: 16px 24px; border-bottom: 1.5px solid var(--pookie-border);
      display: flex; justify-content: space-between; align-items: center; background: #fff7fa;
    }
    .modal-header h3 { font-size: 17px; font-weight: 800; color: var(--text-main); }
    .modal-close {
      background: #fff; border: 1.5px solid var(--pookie-border);
      width: 32px; height: 32px; border-radius: 50%; font-size: 14px;
      cursor: pointer; color: var(--text-muted); font-weight: 700;
      transition: 0.15s;
    }
    .modal-close:hover { background: #fce7f3; transform: rotate(90deg); }

    /* Full View Body */
    .view-body {
      background: #200814; flex: 1; height: 68vh; display: flex;
      justify-content: center; align-items: center; overflow: hidden; padding: 16px;
    }
    .view-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }

    /* Crop Studio Body */
    .edit-body { display: flex; flex-direction: column; height: 75vh; }
    .crop-viewport { flex: 1; background: #1c0512; position: relative; overflow: hidden; }
    .crop-viewport img { max-width: 100%; }
    
    .edit-toolbar {
      padding: 14px 24px; background: #fff5f8; border-top: 1.5px solid var(--pookie-border);
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    }
    .slider-group {
      display: flex; align-items: center; gap: 8px; font-size: 12px;
      font-weight: 700; color: var(--text-muted);
    }
    .slider-group input[type="range"] { accent-color: #ec4899; width: 95px; }

    .modal-footer {
      padding: 14px 24px; border-top: 1.5px solid var(--pookie-border);
      display: flex; justify-content: flex-end; gap: 10px; background: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">🎀</div>
      <div>
        <h1>GhostScan Studio ✨</h1>
      </div>
      <div class="badge-live"><span class="live-sparkle">💖</span> Ready & Synced</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-danger" onclick="clearAll()">🧹 Clear All</button>
      <button class="btn btn-secondary" onclick="exportZipJPEGs()">📦 Export All (ZIP JPEG)</button>
      <button class="btn btn-primary" onclick="exportPDF()">🌸 Export Final PDF</button>
    </div>
  </header>

  <main>
    <div class="subbar">
      <span class="count-pill" id="status-counter">✨ Waiting for cute scans...</span>
    </div>
    <div id="grid"></div>
  </main>

  <!-- 1. FULL VIEW MODAL -->
  <div class="modal-overlay" id="viewModal">
    <div class="modal-box" style="max-width: 860px;">
      <div class="modal-header">
        <h3 id="viewTitle">Document Preview 👁️✨</h3>
        <button class="modal-close" onclick="closeViewModal()">✕</button>
      </div>
      <div class="view-body">
        <img id="fullViewImg" src="" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeViewModal()">Close</button>
        <button class="btn btn-secondary" id="viewDownloadBtn">💾 Download JPEG</button>
        <button class="btn btn-primary" id="viewEditBtn">✂️ Crop & Adjust</button>
      </div>
    </div>
  </div>

  <!-- 2. CROP & ADJUST STUDIO MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Crop & Adjust Studio 🎀</h3>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>
      <div class="edit-body">
        <div class="crop-viewport">
          <img id="cropperTargetImg" src="" />
        </div>
        <div class="edit-toolbar">
          <div style="display:flex; gap: 8px;">
            <button class="btn btn-secondary" onclick="cropper.rotate(-90)" title="Rotate Left">↺ 90°</button>
            <button class="btn btn-secondary" onclick="cropper.rotate(90)" title="Rotate Right">↻ 90°</button>
            <button class="btn btn-secondary" onclick="cropper.reset()">Reset Crop</button>
          </div>
          <div class="slider-group">
            <label>Brightness ✨</label>
            <input type="range" id="brightnessInput" min="60" max="150" value="100" oninput="updateFilters()">
          </div>
          <div class="slider-group">
            <label>Contrast 🎨</label>
            <input type="range" id="contrastInput" min="60" max="180" value="100" oninput="updateFilters()">
          </div>
          <div class="slider-group">
            <input type="checkbox" id="bwCheck" onchange="updateFilters()">
            <label for="bwCheck">Pure B&W 🖤</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEditedImage()">💖 Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const { jsPDF } = window.jspdf;
    let pages = [];
    let cropper = null;
    let activeIndex = null;

    socket.on('new_page', (base64Img) => {
      pages.push({ id: Date.now() + Math.random(), base64: base64Img });
      render();
    });

    function render() {
      const grid = document.getElementById('grid');
      const counter = document.getElementById('status-counter');
      grid.innerHTML = '';

      if (pages.length === 0) {
        counter.innerText = '🌸 0 Pages in Workspace';
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎀 📸</div>
            <h3>Waiting for Scans!</h3>
            <p style="margin-top:6px;">Snap documents from your phone camera to preview, crop & export in style ✨</p>
          </div>
        `;
        return;
      }

      counter.innerText = `🎀 Total Pages: ${pages.length} Captured`;

      pages.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'doc-card';
        card.innerHTML = `
          <div class="thumb-area" onclick="openViewModal(${idx})">
            <img src="data:image/jpeg;base64,${p.base64}" />
            <div class="view-overlay-btn">👁️ Click to View ✨</div>
          </div>
          <div class="card-footer">
            <span class="page-index">🌸 #${idx + 1}</span>
            <div class="action-icons">
              <button class="icon-btn" title="View Full" onclick="openViewModal(${idx})">👁️</button>
              <button class="icon-btn" title="Crop & Edit" onclick="openEditModal(${idx})">✂️</button>
              <button class="icon-btn" title="Download JPEG" onclick="downloadSingleJPEG(${idx})">💾</button>
              <button class="icon-btn delete" title="Delete Page" onclick="deletePage(${idx})">🗑️</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    /* FULL VIEW */
    function openViewModal(index) {
      activeIndex = index;
      document.getElementById('viewTitle').innerText = `Document #${index + 1} of ${pages.length} 👁️`;
      const img = document.getElementById('fullViewImg');
      img.src = 'data:image/jpeg;base64,' + pages[index].base64;

      document.getElementById('viewDownloadBtn').onclick = () => downloadSingleJPEG(index);
      document.getElementById('viewEditBtn').onclick = () => {
        closeViewModal();
        openEditModal(index);
      };
      document.getElementById('viewModal').style.display = 'flex';
    }

    function closeViewModal() {
      document.getElementById('viewModal').style.display = 'none';
    }

    /* CROP & EDIT STUDIO */
    function openEditModal(index) {
      activeIndex = index;
      const targetImg = document.getElementById('cropperTargetImg');
      targetImg.src = 'data:image/jpeg;base64,' + pages[index].base64;

      document.getElementById('brightnessInput').value = 100;
      document.getElementById('contrastInput').value = 100;
      document.getElementById('bwCheck').checked = false;
      targetImg.style.filter = 'none';

      document.getElementById('editModal').style.display = 'flex';

      if (cropper) cropper.destroy();
      cropper = new Cropper(targetImg, {
        viewMode: 1,
        autoCropArea: 0.95,
        responsive: true,
        background: false
      });
    }

    function updateFilters() {
      const b = document.getElementById('brightnessInput').value;
      const c = document.getElementById('contrastInput').value;
      const bw = document.getElementById('bwCheck').checked;

      const container = document.querySelector('.cropper-container');
      if (container) {
        container.style.filter = `brightness(${b}%) contrast(${c}%) ${bw ? 'grayscale(100%)' : ''}`;
      }
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
    }

    function saveEditedImage() {
      if (!cropper || activeIndex === null) return;
      const croppedCanvas = cropper.getCroppedCanvas({ imageSmoothingQuality: 'high' });

      const b = document.getElementById('brightnessInput').value;
      const c = document.getElementById('contrastInput').value;
      const bw = document.getElementById('bwCheck').checked;

      const filterCanvas = document.createElement('canvas');
      filterCanvas.width = croppedCanvas.width;
      filterCanvas.height = croppedCanvas.height;
      const ctx = filterCanvas.getContext('2d');

      ctx.filter = `brightness(${b}%) contrast(${c}%) ${bw ? 'grayscale(100%)' : ''}`;
      ctx.drawImage(croppedCanvas, 0, 0);

      pages[activeIndex].base64 = filterCanvas.toDataURL('image/jpeg', 0.92).split(',')[1];
      closeEditModal();
      render();
    }

    /* DELETIONS */
    function deletePage(index) {
      if (confirm(`Delete Page #${index + 1}? 🗑️`)) {
        pages.splice(index, 1);
        render();
      }
    }

    function clearAll() {
      if (pages.length === 0) return;
      if (confirm('Clear all pages from workspace? 🎀')) {
        pages = [];
        render();
      }
    }

    /* EXPORTS: SINGLE JPEG, BULK ZIP, AND PDF */
    function downloadSingleJPEG(index) {
      const link = document.createElement('a');
      link.download = `GhostScan_Page_${index + 1}.jpg`;
      link.href = 'data:image/jpeg;base64,' + pages[index].base64;
      link.click();
    }

    async function exportZipJPEGs() {
      if (pages.length === 0) return alert('No pages to export! 🌸');
      const zip = new JSZip();
      pages.forEach((p, idx) => {
        zip.file(`GhostScan_Page_${idx + 1}.jpg`, p.base64, { base64: true });
      });
      const blob = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `GhostScan_JPEGs_${Date.now()}.zip`;
      link.click();
    }

    function exportPDF() {
      if (pages.length === 0) return alert('No pages to export! 🌸');
      const pdf = new jsPDF('p', 'mm', 'a4');
      pages.forEach((p, idx) => {
        if (idx > 0) pdf.addPage();
        pdf.addImage('data:image/jpeg;base64,' + p.base64, 'JPEG', 10, 10, 190, 277);
      });
      pdf.save(`GhostScan_Document_${Date.now()}.pdf`);
    }

    render();
  </script>
</body>
</html>
