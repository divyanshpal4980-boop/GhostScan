<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#18040f">
  <title>GhostScan Mobile 🎀</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #18040f; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* Pookie Top Bar */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 68px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 18px; z-index: 20; background: linear-gradient(180deg, rgba(24, 4, 15, 0.95), transparent);
    }
    .badge-live {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800;
      color: #fbcfe8; background: rgba(244, 114, 182, 0.2); border: 1.5px solid #f472b6;
      padding: 6px 13px; border-radius: 20px;
    }
    .dot { width: 7px; height: 7px; background: #f472b6; border-radius: 50%; box-shadow: 0 0 8px #f472b6; }

    .control-pills { display: flex; gap: 8px; }
    .pill-btn {
      background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
      cursor: pointer; backdrop-filter: blur(10px); transition: 0.2s;
    }
    .pill-btn.active { background: #ec4899; border-color: #f472b6; color: #fff; box-shadow: 0 0 12px rgba(236,72,153,0.6); }

    /* Viewport & Cute Viewfinder */
    .viewport { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }

    .viewfinder {
      position: absolute; width: 84%; height: 75%;
      pointer-events: none; border-radius: 20px;
    }
    .corner {
      position: absolute; width: 28px; height: 28px; border-color: #f472b6;
      border-style: solid; border-width: 0; filter: drop-shadow(0 0 4px rgba(244,114,182,0.6));
    }
    .top-left { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 12px; }
    .top-right { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 12px; }
    .bottom-left { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 12px; }
    .bottom-right { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 12px; }

    /* Shutter Bar with Bubble Ring */
    .shutter-bar {
      height: 130px; background: #18040f; display: flex;
      flex-direction: column; justify-content: center; align-items: center; z-index: 20;
    }
    .shutter-ring {
      width: 80px; height: 80px; border-radius: 50%;
      border: 3.5px solid #fbcfe8;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      box-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .shutter-ring:active { transform: scale(0.9); }
    .shutter-core {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #db2777);
      display: flex; justify-content: center; align-items: center;
      font-size: 22px; color: #fff;
    }

    /* Pookie Sweet Toast */
    #toast {
      position: absolute; bottom: 145px; left: 50%; transform: translateX(-50%);
      background: #ffffff; border: 2px solid #f472b6; color: #be185d;
      padding: 10px 22px; border-radius: 25px; font-size: 13px; font-weight: 800;
      display: none; z-index: 30; box-shadow: 0 6px 20px rgba(244,114,182,0.4);
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="badge-live"><span class="dot"></span> GhostScan 🎀</div>
    <div class="control-pills">
      <button id="torch-btn" class="pill-btn" onclick="toggleTorch()">✨ Flash</button>
      <button id="filter-btn" class="pill-btn" onclick="toggleFilter()">🌸 Color</button>
    </div>
  </div>

  <div class="viewport">
    <video id="cam" autoplay playsinline></video>
    <div class="viewfinder">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
    </div>
  </div>

  <div id="toast">💖 Transferred to PC ✨</div>

  <div class="shutter-bar">
    <div class="shutter-ring" id="snap">
      <div class="shutter-core">🎀</div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const socket = io();
    const video = document.getElementById('cam');
    const canvas = document.getElementById('canvas');
    let videoTrack = null;
    let isTorchOn = false;
    let isBwMode = false;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
      videoTrack = stream.getVideoTracks()[0];
    }).catch(err => alert("Camera permission error: " + err));

    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (!capabilities.torch) return alert("Torch not supported on this phone 🌸");
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        const btn = document.getElementById('torch-btn');
        btn.classList.toggle('active', isTorchOn);
      } catch (e) { alert("Flashlight Error: " + e); }
    }

    function toggleFilter() {
      isBwMode = !isBwMode;
      const btn = document.getElementById('filter-btn');
      btn.innerText = isBwMode ? "🖤 Pure B&W" : "🌸 Color";
      btn.classList.toggle('active', isBwMode);
    }

    document.getElementById('snap').onclick = () => {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      if (isBwMode) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          let v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          v = v > 128 ? Math.min(255, v * 1.15) : Math.max(0, v * 0.85);
          d[i] = d[i+1] = d[i+2] = v;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      const base64Img = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
      socket.emit('send_frame', base64Img);

      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(50);
      setTimeout(() => { toast.style.display = 'none'; }, 950);
    };
  </script>
</body>
</html>
