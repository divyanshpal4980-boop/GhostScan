<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Doc Scanner Camera</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    
    /* Top Toolbar */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 60px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 10; background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
    }
    .tool-btn {
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      cursor: pointer; backdrop-filter: blur(5px);
    }
    .tool-btn.active { background: #28a745; }

    /* Camera View & Scanner Overlay */
    .camera-container {
      flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .scan-guide {
      position: absolute; width: 85%; height: 75%;
      border: 2px dashed rgba(255,255,255,0.4); border-radius: 12px;
      pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
    }

    /* Bottom Control Bar */
    .bottom-bar {
      height: 110px; background: #000; display: flex; justify-content: center; align-items: center; z-index: 10;
    }
    .shutter-btn {
      width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff;
      background: #fff; position: relative; cursor: pointer; transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.9); }
    .shutter-inner {
      position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px;
      border-radius: 50%; background: #28a745;
    }
    #status-toast {
      position: absolute; bottom: 125px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #28a745; border: 1px solid #28a745;
      padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: bold;
      display: none; z-index: 20;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button id="torch-btn" class="tool-btn" onclick="toggleTorch()">⚡ Flash: OFF</button>
    <button id="filter-btn" class="tool-btn" onclick="toggleFilter()">📄 Filter: Color</button>
  </div>

  <div class="camera-container">
    <video id="cam" autoplay playsinline></video>
    <div class="scan-guide"></div>
  </div>

  <div id="status-toast">Page Sent! ✓</div>

  <div class="bottom-bar">
    <div class="shutter-btn" id="snap">
      <div class="shutter-inner"></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const socket = io();
    const video = document.getElementById('cam');
    const canvas = document.getElementById('canvas');
    let videoTrack = null;
    let isTorchOn = false;
    let isBwMode = false;

    // Camera Init
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
      videoTrack = stream.getVideoTracks()[0];
    }).catch(err => alert("Camera permission error: " + err));

    // Flash / Torch Toggle
    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (!capabilities.torch) {
          alert("Torch not supported on this browser/camera");
          return;
        }
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        const btn = document.getElementById('torch-btn');
        btn.innerText = isTorchOn ? "⚡ Flash: ON" : "⚡ Flash: OFF";
        btn.classList.toggle('active', isTorchOn);
      } catch (e) {
        alert("Flash Error: " + e);
      }
    }

    // Filter Toggle (Color vs Document B&W)
    function toggleFilter() {
      isBwMode = !isBwMode;
      const btn = document.getElementById('filter-btn');
      btn.innerText = isBwMode ? "📄 Filter: B&W" : "📄 Filter: Color";
      btn.classList.toggle('active', isBwMode);
    }

    // Capture & Send
    document.getElementById('snap').onclick = () => {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      // Apply High-Contrast B&W Document Filter if selected
      if (isBwMode) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          let v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          // Document clean-up threshold
          v = v > 128 ? Math.min(255, v * 1.15) : Math.max(0, v * 0.85);
          d[i] = d[i+1] = d[i+2] = v;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // Convert to base64 & send
      const base64Img = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
      socket.emit('send_frame', base64Img);

      // Toast feedback
      const toast = document.getElementById('status-toast');
      toast.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(50);
      setTimeout(() => { toast.style.display = 'none'; }, 900);
    };
  </script>
</body>
</html>
