<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090d16">
  <title>GhostScan Mobile Terminal</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 64px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px; z-index: 20; background: linear-gradient(180deg, rgba(9, 13, 22, 0.95), transparent);
    }
    .badge-live {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;
      color: #4ade80; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 5px 11px; border-radius: 20px;
    }
    .dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; }

    .control-pills { display: flex; gap: 8px; }
    .pill-btn {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
      color: #f1f5f9; padding: 7px 13px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    .pill-btn.active { background: #2563eb; border-color: #3b82f6; color: #fff; }

    .viewport { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }

    .viewfinder {
      position: absolute; width: 84%; height: 75%;
      pointer-events: none; border-radius: 8px;
    }
    .corner {
      position: absolute; width: 24px; height: 24px; border-color: #38bdf8;
      border-style: solid; border-width: 0;
    }
    .top-left { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 6px; }
    .top-right { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 6px; }
    .bottom-left { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 6px; }
    .bottom-right { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 6px; }

    .shutter-bar {
      height: 125px; background: #090d16; display: flex;
      flex-direction: column; justify-content: center; align-items: center; z-index: 20;
    }
    .shutter-ring {
      width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      transition: transform 0.1s;
    }
    .shutter-ring:active { transform: scale(0.92); }
    .shutter-core { width: 62px; height: 62px; border-radius: 50%; background: #2563eb; }

    #toast {
      position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
      background: #0f172a; border: 1px solid #38bdf8; color: #38bdf8;
      padding: 9px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
      display: none; z-index: 30; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="badge-live"><span class="dot"></span> GhostScan Live</div>
    <div class="control-pills">
      <button id="torch-btn" class="pill-btn" onclick="toggleTorch()">⚡ Flash</button>
      <button id="filter-btn" class="pill-btn" onclick="toggleFilter()">📄 Filter: Color</button>
    </div>
  </div>

  <div class="viewport">
    <video id="cam" autoplay playsinline></video>
    <div class="viewfinder">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
    </div>
  </div>

  <div id="toast">Transferred to Workspace ✓</div>

  <div class="shutter-bar">
    <div class="shutter-ring" id="snap">
      <div class="shutter-core"></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const socket = io();
    const video = document.getElementById('cam');
    const canvas = document.getElementById('canvas');
    let videoTrack = null;
    let isTorchOn = false;
    let isBwMode = false;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
      videoTrack = stream.getVideoTracks()[0];
    }).catch(err => alert("Camera permission error: " + err));

    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (!capabilities.torch) return alert("Flashlight not supported on this device");
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        const btn = document.getElementById('torch-btn');
        btn.classList.toggle('active', isTorchOn);
      } catch (e) { alert("Flashlight Error: " + e); }
    }

    function toggleFilter() {
      isBwMode = !isBwMode;
      const btn = document.getElementById('filter-btn');
      btn.innerText = isBwMode ? "📄 Filter: B&W" : "📄 Filter: Color";
      btn.classList.toggle('active', isBwMode);
    }

    document.getElementById('snap').onclick = () => {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      if (isBwMode) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          let v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          v = v > 128 ? Math.min(255, v * 1.15) : Math.max(0, v * 0.85);
          d[i] = d[i+1] = d[i+2] = v;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      const base64Img = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
      socket.emit('send_frame', base64Img);

      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(40);
      setTimeout(() => { toast.style.display = 'none'; }, 900);
    };
  </script>
</body>
</html>
