<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#18040f">
  <title>Divyansh Mobile 🎀</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #18040f; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* Top Navigation */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 68px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 14px; z-index: 20; background: linear-gradient(180deg, rgba(24, 4, 15, 0.95), transparent);
    }
    .badge-live {
      display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
      font-weight: 800; color: #fbcfe8; background: rgba(244, 114, 182, 0.2); border: 1.5px solid #f472b6;
      padding: 6px 10px; border-radius: 20px; cursor: pointer;
    }
    .dot { width: 7px; height: 7px; background: #f472b6; border-radius: 50%; }

    .control-pills { display: flex; gap: 5px; }
    .pill-btn {
      background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
      cursor: pointer; backdrop-filter: blur(8px); transition: 0.15s;
    }
    .pill-btn:active { transform: scale(0.92); }
    .pill-btn.active { background: #ec4899; border-color: #f472b6; }
    .inbox-badge { background: #3b82f6; border-color: #60a5fa; color: #fff; }

    /* Camera Viewport */
    .viewport { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .viewfinder { position: absolute; width: 84%; height: 75%; pointer-events: none; border-radius: 20px; }
    .corner { position: absolute; width: 28px; height: 28px; border-color: #f472b6; border-style: solid; border-width: 0; }
    .top-left { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 12px; }
    .top-right { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 12px; }
    .bottom-left { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 12px; }
    .bottom-right { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 12px; }

    /* Recording Timer Badge */
    .rec-badge {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(225, 29, 72, 0.9); color: #fff; padding: 6px 16px;
      border-radius: 20px; font-size: 13px; font-weight: 800; display: none;
      align-items: center; gap: 8px; z-index: 25; box-shadow: 0 0 16px rgba(225, 29, 72, 0.6);
    }
    .rec-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Bottom Controller Area */
    .bottom-section {
      background: #18040f; display: flex; flex-direction: column; align-items: center;
      padding-bottom: 12px; z-index: 20;
    }

    /* Mode Selector (Photo vs Video) */
    .mode-selector {
      display: flex; gap: 18px; margin: 8px 0 12px;
    }
    .mode-tab {
      font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.5); letter-spacing: 1px;
      cursor: pointer; transition: 0.2s; padding: 3px 10px; border-radius: 12px;
    }
    .mode-tab.active {
      color: #fbcfe8; background: rgba(244, 114, 182, 0.25); text-shadow: 0 0 8px rgba(244,114,182,0.8);
    }

    /* Shutter Bar */
    .shutter-bar {
      width: 100%; display: flex; justify-content: space-evenly; align-items: center; padding: 0 16px;
    }
    .action-circle-btn {
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12); border: 2px solid #f472b6;
      color: #fff; font-size: 20px; display: flex; justify-content: center;
      align-items: center; cursor: pointer; transition: 0.15s;
    }
    .action-circle-btn:active { transform: scale(0.9); }

    .shutter-ring {
      width: 78px; height: 78px; border-radius: 50%; border: 3.5px solid #fbcfe8;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      transition: all 0.2s;
    }
    .shutter-ring:active { transform: scale(0.92); }
    .shutter-ring.recording {
      border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }

    .shutter-core {
      width: 62px; height: 62px; border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #db2777);
      display: flex; justify-content: center; align-items: center; font-size: 20px; color: #fff;
      transition: all 0.2s;
    }
    .shutter-core.video-mode {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
    }
    .shutter-core.recording {
      width: 32px; height: 32px; border-radius: 8px; background: #ef4444; font-size: 0;
    }

    /* Toast */
    #toast {
      position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%);
      background: #ffffff; border: 2px solid #f472b6; color: #be185d;
      padding: 9px 20px; border-radius: 25px; font-size: 13px; font-weight: 800;
      display: none; z-index: 30; box-shadow: 0 4px 15px rgba(244, 114, 182, 0.4);
    }

    /* Drawer */
    .drawer {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px);
      z-index: 100; display: none; flex-direction: column; justify-content: flex-end;
    }
    .drawer-content {
      background: #fff; border-radius: 24px 24px 0 0; padding: 20px; max-height: 75vh; overflow-y: auto;
    }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .inbox-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; background: #fff5f8; border: 1.5px solid #fbcfe8; border-radius: 14px; margin-bottom: 10px;
    }
    .download-pill {
      background: #ec4899; color: #fff; border: none; padding: 6px 14px;
      border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    /* PIN Modal */
    .pin-modal {
      position: fixed; inset: 0; background: rgba(24, 4, 15, 0.95);
      z-index: 150; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 24px;
    }
    .pin-box {
      background: #fff; padding: 28px 24px; border-radius: 24px; width: 100%; max-width: 320px; text-align: center;
    }
    .pin-input {
      width: 100%; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: 6px;
      padding: 10px; border-radius: 14px; border: 2px solid #f472b6; margin: 16px 0; outline: none;
    }
    .pin-btn {
      width: 100%; background: #ec4899; color: #fff; font-size: 15px; font-weight: 800;
      padding: 12px; border: none; border-radius: 18px; cursor: pointer;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="badge-live" onclick="showPinModal()">
      <span class="dot"></span> PIN: <b id="currentPinDisplay">----</b>
    </div>
    <div class="control-pills">
      <button id="flip-btn" class="pill-btn" onclick="toggleCamera()">🔄 Flip</button>
      <button id="torch-btn" class="pill-btn" onclick="toggleTorch()">✨ Flash</button>
      <button id="filter-btn" class="pill-btn" onclick="toggleFilter()">🌸 Color</button>
      <button class="pill-btn inbox-badge" onclick="openDrawer()">📥 (<span id="inbox-count">0</span>)</button>
    </div>
  </div>

  <div class="viewport">
    <video id="cam" autoplay playsinline muted></video>
    <div class="viewfinder">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
    </div>
    <!-- Live Recording Badge -->
    <div class="rec-badge" id="recBadge">
      <span class="rec-dot"></span>
      <span id="recTimerText">REC 00:00</span>
    </div>
  </div>

  <div id="toast">💖 Transferred! ✨</div>

  <!-- Bottom Section: Mode switch + Shutter -->
  <div class="bottom-section">
    <div class="mode-selector">
      <span class="mode-tab active" id="tabPhoto" onclick="setMode('photo')">PHOTO</span>
      <span class="mode-tab" id="tabVideo" onclick="setMode('video')">VIDEO</span>
    </div>

    <div class="shutter-bar">
      <button class="action-circle-btn" onclick="document.getElementById('mobileFileInput').click()" title="Send Files/Gallery">
        📁
      </button>
      <input type="file" id="mobileFileInput" multiple style="display:none" onchange="sendUniversalFiles(this)" />

      <!-- Main Action Shutter -->
      <div class="shutter-ring" id="shutterRing" onclick="handleShutterClick()">
        <div class="shutter-core" id="shutterCore">🎀</div>
      </div>

      <button class="action-circle-btn" onclick="openDrawer()" title="Received from Laptop">
        📥
      </button>
    </div>
  </div>

  <!-- Laptop Inbox Drawer -->
  <div class="drawer" id="inboxDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3 style="font-size: 16px; color: #4c0519;">📥 Files from Laptop</h3>
        <button style="border:none; background:none; font-size: 20px;" onclick="closeDrawer()">✕</button>
      </div>
      <div id="inboxList">
        <p style="color: #9d174d; text-align: center; font-size: 13px;">No files received from this laptop yet.</p>
      </div>
    </div>
  </div>

  <!-- Pair PIN Modal -->
  <div class="pin-modal" id="pinModal">
    <div class="pin-box">
      <h3 style="color:#4c0519; font-size: 18px;">Pair with Laptop 💻</h3>
      <p style="font-size: 12px; color:#9d174d; margin-top: 4px;">Enter the 4-digit PIN showing on your Laptop screen:</p>
      <input type="number" id="pinInput" class="pin-input" placeholder="0000" maxlength="4" />
      <button class="pin-btn" onclick="applyPin()">Connect Device 💖</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const socket = io();
    const video = document.getElementById('cam');
    const canvas = document.getElementById('canvas');
    let currentStream = null;
    let videoTrack = null;
    let isTorchOn = false;
    let isBwMode = false;
    let receivedFiles = [];
    let currentFacingMode = "environment";
    let appMode = "photo"; // 'photo' | 'video'

    // Video Recording Variables
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recordTimerInterval = null;
    let recordSeconds = 0;

    // PIN Setup
    const urlParams = new URLSearchParams(window.location.search);
    let targetPin = urlParams.get('pin') || localStorage.getItem('ghost_phone_pin') || '';

    function showPinModal() {
      document.getElementById('pinInput').value = targetPin;
      document.getElementById('pinModal').style.display = 'flex';
    }

    function applyPin() {
      const entered = document.getElementById('pinInput').value.trim();
      if (!entered) return alert('Please enter 4-digit PIN');
      targetPin = entered;
      localStorage.setItem('ghost_phone_pin', targetPin);
      document.getElementById('currentPinDisplay').innerText = targetPin;
      document.getElementById('pinModal').style.display = 'none';
      socket.emit('join_room', targetPin);
      triggerToast(`Connected to PIN ${targetPin} ✨`);
    }

    if (targetPin) {
      document.getElementById('currentPinDisplay').innerText = targetPin;
      socket.emit('join_room', targetPin);
    } else {
      showPinModal();
    }

    // Camera Init with Microphone support for Videos
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: true
          });
        } catch (audioErr) {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
        }
        currentStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        isTorchOn = false;
        document.getElementById('torch-btn').classList.remove('active');
      } catch (err) {
        alert("Camera error: " + err);
      }
    }

    startCamera();

    async function toggleCamera() {
      if (isRecording) return alert("Stop recording first! 🛑");
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      await startCamera();
      triggerToast(currentFacingMode === "user" ? "🤳 Front Camera" : "📸 Back Camera");
    }

    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (!capabilities.torch) return alert("Torch not supported on this camera 🌸");
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        document.getElementById('torch-btn').classList.toggle('active', isTorchOn);
      } catch (e) { alert("Torch Error: " + e); }
    }

    function toggleFilter() {
      isBwMode = !isBwMode;
      const btn = document.getElementById('filter-btn');
      btn.innerText = isBwMode ? "🖤 Pure B&W" : "🌸 Color";
      btn.classList.toggle('active', isBwMode);
    }

    function triggerToast(txt) {
      const toast = document.getElementById('toast');
      toast.innerText = txt;
      toast.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(50);
      setTimeout(() => { toast.style.display = 'none'; }, 1200);
    }

    /* Mode Switching (Photo vs Video) */
    function setMode(mode) {
      if (isRecording) return alert("Stop recording first! 🛑");
      appMode = mode;
      const tabPhoto = document.getElementById('tabPhoto');
      const tabVideo = document.getElementById('tabVideo');
      const core = document.getElementById('shutterCore');

      if (mode === 'photo') {
        tabPhoto.classList.add('active');
        tabVideo.classList.remove('active');
        core.classList.remove('video-mode');
        core.innerText = "🎀";
      } else {
        tabVideo.classList.add('active');
        tabPhoto.classList.remove('active');
        core.classList.add('video-mode');
        core.innerText = "🎥";
      }
    }

    /* Main Shutter Click Handler */
    function handleShutterClick() {
      if (!targetPin) return showPinModal();

      if (appMode === 'photo') {
        snapPhoto();
      } else {
        if (!isRecording) {
          startVideoRecording();
        } else {
          stopVideoRecording();
        }
      }
    }

    /* 1. Snap Photo Function */
    function snapPhoto() {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      if (currentFacingMode === "user") {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0);

      if (isBwMode) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          let v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          v = v > 128 ? Math.min(255, v * 1.15) : Math.max(0, v * 0.85);
          d[i] = d[i+1] = d[i+2] = v;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      const base64Img = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
      socket.emit('send_frame', base64Img);
      triggerToast('💖 Photo Sent to Laptop! ✨');
    }

    /* 2. Video Recording Functions */
    function startVideoRecording() {
      if (!currentStream) return alert("Camera not ready!");

      recordedChunks = [];
      const options = { mimeType: 'video/webm;codecs=vp8,opus' };
      try {
        mediaRecorder = new MediaRecorder(currentStream, MediaRecorder.isTypeSupported(options.mimeType) ? options : undefined);
      } catch (e) {
        mediaRecorder = new MediaRecorder(currentStream);
      }

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        const mimeType = mediaRecorder.mimeType || 'video/webm';
        const blob = new Blob(recordedChunks, { type: mimeType });
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';

        triggerToast('⏳ Uploading Video to PC...');

        const reader = new FileReader();
        reader.onload = (e) => {
          socket.emit('send_file', {
            name: `Recorded_Video_${Date.now()}.${ext}`,
            type: mimeType,
            size: blob.size,
            data: e.target.result
          });
          triggerToast('🎥 Video Sent to Laptop! ✨');
        };
        reader.readAsDataURL(blob);
      };

      mediaRecorder.start(1000);
      isRecording = true;

      // UI Updates for Recording
      document.getElementById('shutterRing').classList.add('recording');
      document.getElementById('shutterCore').classList.add('recording');
      document.getElementById('recBadge').style.display = 'inline-flex';

      recordSeconds = 0;
      updateTimerDisplay();
      recordTimerInterval = setInterval(() => {
        recordSeconds++;
        updateTimerDisplay();
      }, 1000);

      if (navigator.vibrate) navigator.vibrate(80);
    }

    function stopVideoRecording() {
      if (!mediaRecorder || !isRecording) return;
      mediaRecorder.stop();
      isRecording = false;

      clearInterval(recordTimerInterval);
      document.getElementById('shutterRing').classList.remove('recording');
      document.getElementById('shutterCore').classList.remove('recording');
      document.getElementById('recBadge').style.display = 'none';

      if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
      const secs = String(recordSeconds % 60).padStart(2, '0');
      document.getElementById('recTimerText').innerText = `REC ${mins}:${secs}`;
    }

    // Universal File Sender (Gallery / Storage)
    async function sendUniversalFiles(input) {
      if (!targetPin) return showPinModal();
      const files = Array.from(input.files);
      if (!files.length) return;

      for (const file of files) {
        await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            socket.emit('send_file', {
              name: file.name,
              type: file.type || 'application/octet-stream',
              size: file.size,
              data: e.target.result
            });
            resolve();
          };
          reader.readAsDataURL(file);
        });
      }
      triggerToast(`📁 ${files.length} File(s) Sent ✨`);
      input.value = '';
    }

    // Inbox Receiver (From Laptop)
    socket.on('receive_file', (file) => {
      receivedFiles.push(file);
      document.getElementById('inbox-count').innerText = receivedFiles.length;
      triggerToast(`📥 File from paired PC! ✨`);
      renderInbox();
    });

    function renderInbox() {
      const container = document.getElementById('inboxList');
      if (!receivedFiles.length) {
        container.innerHTML = `<p style="color: #9d174d; text-align: center; font-size: 13px;">No files received from this laptop yet.</p>`;
        return;
      }
      container.innerHTML = '';
      receivedFiles.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'inbox-item';
        div.innerHTML = `
          <div>
            <div style="font-size: 13px; font-weight: 700; color: #4c0519; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              ${f.name}
            </div>
            <div style="font-size: 11px; color: #9d174d;">${f.type.split('/')[1] || 'File'}</div>
          </div>
          <button class="download-pill" onclick="downloadFile(${idx})">💾 Save</button>
        `;
        container.appendChild(div);
      });
    }

    function downloadFile(idx) {
      const f = receivedFiles[idx];
      const a = document.createElement('a');
      a.href = f.data;
      a.download = f.name;
      a.click();
    }

    function openDrawer() { document.getElementById('inboxDrawer').style.display = 'flex'; }
    function closeDrawer() { document.getElementById('inboxDrawer').style.display = 'none'; }
  </script>
</body>
</html>
